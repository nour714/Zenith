[project]
name = "zenith"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "yt-dlp>=2024.3.10",
    "google-genai>=0.1.0",
    "psycopg2-binary>=2.9.9",
    "pyjwt>=2.14.0",
    "bcrypt>=5.0.0",
]

[tool.vercel]
entrypoint = "backend.main:app"

[tool.pyright]
extraPaths = ["backend"]

